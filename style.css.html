<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka Districts Icons</title>
    <style>
        /* ವೆಬ್‌ಸೈಟ್ ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ ಶೈಲಿ */
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* ಐಕಾನ್‌ಗಳು ಜೋಡಣೆಯಾಗುವ ಗ್ರಿಡ್ */
        .district-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* ನೀವು ಕಳುಹಿಸಿದ ಚಿತ್ರದಂತಿರುವ ಸ್ಕ್ವೇರ್ ಬಾಕ್ಸ್ ಐಕಾನ್ ವಿನ್ಯಾಸ */
        .district-button {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            /* ನೀಲಿ ಮತ್ತು ಕಪ್ಪು ಗ್ರೇಡಿಯಂಟ್ ಹಿನ್ನೆಲೆ */
            background: linear-gradient(135deg, #0093e9 0%, #000000 100%);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ಮೌಸ್ ಇಟ್ಟಾಗ ಬರುವ ಎಫೆಕ್ಟ್ (Hover Effect) */
        .district-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 147, 233, 0.4);
        }

        /* ಜಿಲ್ಲೆಗಳ ದಪ್ಪ ಬಿಳಿ ಅಕ್ಷರಗಳು ಮತ್ತು ಶಾಡೋ ಎಫೆಕ್ಟ್ */
        .district-name {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            /* ಅಕ್ಷರಗಳ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ನೆರಳಿನ ಎಫೆಕ್ಟ್ */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <!-- ಜಿಲ್ಲೆಗಳ ಐಕಾನ್ ಪಟ್ಟಿ -->
    <div class="district-grid">
        <div class="district-button"><span class="district-name">ಬಾಗಲಕೋಟೆ</span></div>
        <div class="district-button"><span class="district-name">ಬಳ್ಳಾರಿ</span></div>
        <div class="district-button"><span class="district-name">ಬೆಳಗಾವಿ</span></div>
        <div class="district-button"><span class="district-name">ಬೆಂಗಳೂರು ಗ್ರಾಮಾಂತರ</span></div>
        <div class="district-button"><span class="district-name">ಬೆಂಗಳೂರು ನಗರ</span></div>
        <div class="district-button"><span class="district-name">ಬೀದರ್</span></div>
        <div class="district-button"><span class="district-name">ಚಾಮರಾಜನಗರ</span></div>
        <div class="district-button"><span class="district-name">ಚಿಕ್ಕಬಳ್ಳಾಪುರ</span></div>
        <div class="district-button"><span class="district-name">ಚಿಕ್ಕಮಗಳೂರು</span></div>
        <div class="district-button"><span class="district-name">ಚಿತ್ರದುರ್ಗ</span></div>
        <div class="district-button"><span class="district-name">ದಕ್ಷಿಣ ಕನ್ನಡ</span></div>
        <div class="district-button"><span class="district-name">ದಾವಣಗೆರೆ</span></div>
        <div class="district-button"><span class="district-name">ಧಾರವಾಡ</span></div>
        <div class="district-button"><span class="district-name">ಗದಗ</span></div>
        <div class="district-button"><span class="district-name">ಹಾಸನ</span></div>
        <div class="district-button"><span class="district-name">ಹಾವೇರಿ</span></div>
        <div class="district-button"><span class="district-name">ಕಲಬುರಗಿ</span></div>
        <div class="district-button"><span class="district-name">ಕೊಡಗು</span></div>
        <div class="district-button"><span class="district-name">ಕೋಲಾರ</span></div>
        <div class="district-button"><span class="district-name">ಕೊಪ್ಪಳ</span></div>
        <div class="district-button"><span class="district-name">ಮಂಡ್ಯ</span></div>
        <div class="district-button"><span class="district-name">ಮೈಸೂರು</span></div>
        <div class="district-button"><span class="district-name">ರಾಯಚೂರು</span></div>
        <div class="district-button"><span class="district-name">ರಾಮನಗರ</span></div>
        <div class="district-button"><span class="district-name">ಶಿವಮೊಗ್ಗ</span></div>
        <div class="district-button"><span class="district-name">ತುಮಕೂರು</span></div>
        <div class="district-button"><span class="district-name">ಉಡುಪಿ</span></div>
        <div class="district-button"><span class="district-name">ಉತ್ತರ ಕನ್ನಡ</span></div>
        <div class="district-button"><span class="district-name">ವಿಜಯಪುರ</span></div>
        <div class="district-button"><span class="district-name">ವಿಜಯನಗರ</span></div>
        <div class="district-button"><span class="district-name">ಯಾದಗಿರಿ</span></div>
    </div>

</body>
</html>
